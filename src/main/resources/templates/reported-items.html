<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Reported Items - FindIt</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<header class="header">

    <div class="logo">
        <span class="search-icon">⌕</span>
        <h1>FindIt</h1>
    </div>

    <h2>Lost and Found Management System</h2>

</header>

<div class="container">

    <a href="/" class="back-button">← Back to Home</a>

    <h2>Reported Items So Far</h2>

    <div th:if="${items.isEmpty()}">
        <p>No items have been reported yet.</p>
    </div>

    <div th:each="item : ${items}" class="card">

        <h3 th:text="${item.itemName}"></h3>

        <span th:if="${item.type == 'LOST'}" class="badge lost">LOST</span>
        <span th:if="${item.type == 'FOUND'}" class="badge found">FOUND</span>

        <p><b>Description:</b> <span th:text="${item.description}"></span></p>

        <p><b>Location:</b> <span th:text="${item.location}"></span></p>

        <p><b>Date:</b> <span th:text="${item.date}"></span></p>

        <p><b>Reported by:</b> <span th:text="${item.reporterName}"></span></p>

        <p><b>Status:</b> <span th:text="${item.status}"></span></p>

    </div>

</div>

</body>
</html>
